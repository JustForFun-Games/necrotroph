# Run once per game: makes the Android upload key, encrypts it with the ANDROID_KEY_PASSWORD secret and saves it to
# keys/android-upload.jks.enc here. The private repository's publishing step leaves keys/ alone.
name: Android · make the upload key (once)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check
        env:
          PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$PW" ]; then echo "::error::Add the ANDROID_KEY_PASSWORD secret first"; exit 1; fi
          if [ ${#PW} -lt 12 ]; then echo "::error::ANDROID_KEY_PASSWORD should be at least 12 characters"; exit 1; fi
          if [ -f keys/android-upload.jks.enc ]; then echo "::error::An upload key already exists. Delete keys/android-upload.jks.enc only if you mean to replace it (Google Play would then need to be told)."; exit 1; fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Make and encrypt the key
        env:
          PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          DEV=$(node -p "require('./app/app.json').developer || 'Developer'")
          NAME=$(node -p "require('./app/app.json').name")
          keytool -genkeypair -keystore upload.jks -storetype PKCS12 -alias upload -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$PW" -keypass "$PW" -dname "CN=$DEV, O=$NAME, C=US"
          mkdir -p keys
          openssl enc -aes-256-cbc -pbkdf2 -iter 250000 -salt -in upload.jks -out keys/android-upload.jks.enc -pass env:PW
          rm -f upload.jks
      - name: Save it here
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add keys/android-upload.jks.enc
          git commit -m "Add the encrypted Android upload key"
          git push
